services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerline_db
      POSTGRES_USER: ledgerline_app
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - ledgerline-postgres:/var/lib/postgresql/data
volumes:
  ledgerline-postgres:
